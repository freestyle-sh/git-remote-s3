name: S3 workspace tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install guest dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fuse3 git-lfs
          sudo modprobe fuse
      - name: Build and verify pinned ArtifactFS
        env:
          ARTIFACT_FS_CHECK: '1'
        run: packaging/build-artifact-fs.sh "$RUNNER_TEMP/artifact-fs"
      - name: Exercise the Ubuntu installer
        run: sudo env SKIP_APT=1 ARTIFACT_FS_BINARY="$RUNNER_TEMP/artifact-fs" ./install.sh
      - name: Install test dependencies
        run: sudo /opt/freestyle/git-s3/bin/pip install pytest mock 'moto[s3,server]'
      - name: Unit and Git/S3 integration tests
        run: PATH=/opt/freestyle/git-s3/bin:$PATH /opt/freestyle/git-s3/bin/pytest -q test
      - name: Real FUSE, npm, native I/O, and restart tests as unprivileged user
        env:
          AFS_RUN_E2E_TESTS: '1'
        run: PATH=/opt/freestyle/git-s3/bin:$PATH /opt/freestyle/git-s3/bin/pytest -q -s test/fuse_test.py
